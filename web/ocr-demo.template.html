<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lw.PPOCR.C · 离线 OCR 工作台</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #182230; background: #f3f6fa; }
    header { padding: 28px max(20px, calc((100% - 1180px) / 2)); background: #13243a; color: #fff; }
    header h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .2px; }
    header p { margin: 0; color: #b8c7d9; font-size: 14px; }
    main { max-width: 1180px; margin: 24px auto; padding: 0 20px 40px; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
    .options { display: flex; align-items: center; gap: 7px; padding: 11px 13px; border: 1px solid #e0e7ef; border-radius: 8px; background: #fff; color: #526277; font-size: 13px; }
    .options input { accent-color: #2878d4; }
    .dropzone { flex: 1; min-width: 260px; padding: 14px 18px; border: 1px dashed #9aabc0; border-radius: 10px; background: #fff; cursor: pointer; }
    .dropzone.drag { border-color: #2878d4; background: #edf5ff; }
    .dropzone strong { display: block; font-size: 14px; }
    .dropzone span { display: block; margin-top: 3px; color: #718096; font-size: 12px; }
    input[type=file] { display: none; }
    button { border: 0; border-radius: 8px; padding: 12px 20px; color: #fff; background: #2878d4; font-weight: 600; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #status { min-height: 20px; color: #526277; font-size: 13px; }
    #stats { margin: 0 0 18px; color: #607086; font-size: 12px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: 18px; }
    .card { overflow: hidden; border: 1px solid #e0e7ef; border-radius: 12px; background: #fff; box-shadow: 0 4px 14px #1c35570d; }
    .card h2 { margin: 0; padding: 14px 18px; border-bottom: 1px solid #edf1f5; font-size: 15px; }
    .result-header { display: flex; min-height: 49px; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px 8px 18px; border-bottom: 1px solid #edf1f5; }
    .result-header h2 { flex: 1; padding: 0; border: 0; }
    .result-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .result-actions button { padding: 7px 10px; border: 1px solid #cbd8e6; background: #fff; color: #2867ad; font-size: 12px; }
    .result-actions button:hover:not(:disabled) { border-color: #2878d4; background: #edf5ff; }
    .preview { display: flex; min-height: 420px; align-items: center; justify-content: center; padding: 16px; background: #f9fbfd; }
    canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; background: #eef2f6; }
    #results { max-height: 540px; overflow: auto; }
    .empty { padding: 44px 20px; color: #8794a6; text-align: center; font-size: 13px; }
    .line { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #edf1f5; }
    .line:last-child { border-bottom: 0; }
    .index { color: #8b99aa; font-variant-numeric: tabular-nums; }
    .text { overflow-wrap: anywhere; font-size: 14px; line-height: 1.5; }
    .score { margin-top: 3px; color: #8290a0; font-size: 11px; }
    .support { display: flex; gap: 24px; align-items: center; margin-top: 18px; padding: 20px; }
    .support h2 { margin: 0 0 8px; font-size: 16px; }
    .support p { margin: 0 0 8px; color: #607086; font-size: 13px; line-height: 1.6; }
    .support img { width: 150px; height: 150px; flex: 0 0 auto; border-radius: 8px; object-fit: cover; }
    a { color: #2878d4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { margin-top: 18px; color: #8491a2; font-size: 12px; text-align: right; }
    @media (max-width: 480px) { .support { align-items: flex-start; } .support img { width: 112px; height: 112px; } }
    @media (max-width: 760px) { main { margin-top: 16px; } .grid { grid-template-columns: 1fr; } .preview { min-height: 280px; } }
  </style>
</head>
<body>
  <header>
    <h1>lw.PPOCR.C · 离线 OCR 工作台</h1>
    <p>纯浏览器本地推理 · 模型和 WASM 已内嵌 · 图片不会上传到网络</p>
  </header>
  <main>
    <div class="toolbar">
      <label id="dropzone" class="dropzone" for="file">
        <strong>选择或拖入图片</strong>
        <span>支持 JPG、PNG、BMP 等浏览器可解码格式</span>
      </label>
      <input id="file" type="file" accept="image/*">
      <label class="options"><input id="use-cls" type="checkbox"> 启用方向分类（CLS）</label>
      <button id="run" type="button" disabled>开始识别</button>
      <span id="status" aria-live="polite">正在加载 WASM 和模型…</span>
  </div>
    <div id="stats">引擎状态：加载中</div>
    <div class="grid">
      <section class="card">
        <h2>图像预览与检测框</h2>
        <div class="preview"><canvas id="canvas"></canvas></div>
      </section>
      <section class="card">
        <div class="result-header">
          <h2>识别结果</h2>
          <div class="result-actions" aria-label="识别结果导出">
            <button id="copy-text" type="button" disabled>复制文本</button>
            <button id="export-txt" type="button" disabled>导出 TXT</button>
            <button id="export-json" type="button" disabled>导出 JSON</button>
          </div>
        </div>
        <div id="results"><div class="empty">选择图片后，这里会显示识别文本。</div></div>
      </section>
    </div>
    <section class="support card">
      <img src="data:image/jpeg;base64,__LW_SPONSOR_IMAGE_BASE64__" alt="赞赏二维码">
      <div>
        <h2>联系与支持</h2>
        <p>如果这个离线 OCR 工具对你有帮助，欢迎扫码支持项目维护。</p>
        <p>项目地址：<a href="https://github.com/lxw112190/lw.PPOCR.C" target="_blank" rel="noopener noreferrer">github.com/lxw112190/lw.PPOCR.C</a></p>
      </div>
    </section>
    <footer><a href="https://github.com/lxw112190/lw.PPOCR.C" target="_blank" rel="noopener noreferrer">lw.PPOCR.C</a> · WebAssembly · 完整 DET → CLS → REC 流程</footer>
  </main>
  <script>
    const MODEL_B64 = {
      det: "__LW_DET_MODEL_BASE64__",
      cls: "__LW_CLS_MODEL_BASE64__",
      rec: "__LW_REC_MODEL_BASE64__",
      dict: "__LW_DICTIONARY_BASE64__"
    };
    const RUNTIME_JS = __LW_RUNTIME_JS_JSON__;
    const fileInput = document.getElementById("file");
    const dropzone = document.getElementById("dropzone");
    const runButton = document.getElementById("run");
    const clsInput = document.getElementById("use-cls");
    const statusNode = document.getElementById("status");
    const statsNode = document.getElementById("stats");
    const canvas = document.getElementById("canvas");
    const resultsNode = document.getElementById("results");
    const copyTextButton = document.getElementById("copy-text");
    const exportTxtButton = document.getElementById("export-txt");
    const exportJsonButton = document.getElementById("export-json");
    const exportButtons = [copyTextButton, exportTxtButton, exportJsonButton];
    const WEB_ABI_VERSION = 1;
    let moduleInstance;
    let loadMilliseconds = 0;
    let runCount = 0;
    let running = false;
    let maxLineCapacity = 0;
    let maxTextCapacity = 0;
    let lineSize = 0;
    let resultSize = 0;
    let sourceCapacity = 0;
    let selectedFile = null;
    let previewSequence = 0;
    let lastResults = null;
    const buffers = {source: 0, lines: 0, text: 0, result: 0};

    function decodeBase64(value) {
      const raw = atob(value);
      const bytes = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; ++i) bytes[i] = raw.charCodeAt(i);
      return bytes;
    }
    function readU32(pointer) { return moduleInstance.HEAPU32[pointer >> 2] >>> 0; }
    function readF32(pointer) { return moduleInstance.HEAPF32[pointer >> 2]; }
    function readUtf8(pointer, length) { return new TextDecoder().decode(moduleInstance.HEAPU8.subarray(pointer, pointer + length)); }
    function escapeHtml(value) { return value.replace(/[&<>]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;"}[c])); }
    function makeFactory() { return eval("(function(){" + RUNTIME_JS + ";return LwPpocrModule;})()"); }

    function setExportEnabled(enabled) {
      for (const button of exportButtons) button.disabled = !enabled;
    }

    function clearLastResults() {
      lastResults = null;
      setExportEnabled(false);
    }

    function plainTextResult() {
      return lastResults ? lastResults.lines.map(line => line.text).join("\n") : "";
    }

    function exportBaseName(source) {
      const leaf = String(source || "").replace(/[\\/]/g, "_");
      const dot = leaf.lastIndexOf(".");
      const stem = (dot > 0 ? leaf.slice(0, dot) : leaf)
        .replace(/[<>:"|?*\u0000-\u001f]/g, "_").trim().replace(/[. ]+$/g, "");
      return (stem || "ocr-result") + "-ocr";
    }

    function downloadResult(content, mimeType, extension) {
      if (!lastResults) return;
      const url = URL.createObjectURL(new Blob([content], {type: mimeType}));
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = exportBaseName(lastResults.source) + extension;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    async function copyPlainText() {
      if (!lastResults) return;
      const result = lastResults;
      const text = result.lines.map(line => line.text).join("\n");
      try {
        if (!navigator.clipboard || !navigator.clipboard.writeText) throw new Error("Clipboard API unavailable");
        await navigator.clipboard.writeText(text);
      } catch (clipboardError) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand("copy");
        textarea.remove();
        if (!copied) throw clipboardError;
      }
      if (lastResults === result) statusNode.textContent = `已复制 ${result.lines.length} 行文本。`;
    }

    function exportTxt() {
      if (!lastResults) return;
      const text = plainTextResult();
      downloadResult(text ? text + "\n" : "", "text/plain;charset=utf-8", ".txt");
      statusNode.textContent = `已导出 ${lastResults.lines.length} 行 TXT。`;
    }

    function exportJson() {
      if (!lastResults) return;
      downloadResult(JSON.stringify(lastResults, null, 2) + "\n", "application/json;charset=utf-8", ".json");
      statusNode.textContent = `已导出 ${lastResults.lines.length} 行 JSON。`;
    }

    function allocate(size, label) {
      const pointer = moduleInstance._lw_web_malloc(size);
      if (!pointer) throw new Error(`无法分配 ${label}（${size} 字节）`);
      return pointer;
    }

    function releaseBuffers() {
      if (!moduleInstance) return;
      for (const name of ["source", "lines", "text", "result"]) {
        if (buffers[name]) moduleInstance._lw_web_free(buffers[name]);
        buffers[name] = 0;
      }
      sourceCapacity = 0;
      maxLineCapacity = 0;
      maxTextCapacity = 0;
      lineSize = 0;
      resultSize = 0;
    }

    function shutdownEngine() {
      if (!moduleInstance) return;
      releaseBuffers();
      moduleInstance._lw_web_shutdown();
    }

    function ensureSourceCapacity(required) {
      if (required <= sourceCapacity) return buffers.source;
      const replacement = allocate(required, "输入图像缓冲区");
      if (buffers.source) moduleInstance._lw_web_free(buffers.source);
      buffers.source = replacement;
      sourceCapacity = required;
      return buffers.source;
    }

    function allocateOutputBuffers() {
      const infoSize = moduleInstance._lw_web_info_size();
      if (infoSize !== 20) throw new Error(`不支持的 Web ABI 信息大小：${infoSize}`);
      const infoPointer = allocate(infoSize, "Web ABI 信息");
      try {
        const status = moduleInstance._lw_web_get_info(infoPointer);
        if (status !== 0) throw new Error("读取引擎容量失败：" + status);
        const abiVersion = readU32(infoPointer);
        if (abiVersion !== WEB_ABI_VERSION) throw new Error(`不支持的 Web ABI：${abiVersion}`);
        maxLineCapacity = readU32(infoPointer + 4);
        maxTextCapacity = readU32(infoPointer + 8);
        lineSize = readU32(infoPointer + 12);
        resultSize = readU32(infoPointer + 16);
        if (!maxLineCapacity || !maxTextCapacity || lineSize !== 60 || resultSize !== 16) {
          throw new Error("引擎返回了无效的输出容量");
        }
      } finally {
        moduleInstance._lw_web_free(infoPointer);
      }
      buffers.lines = allocate(maxLineCapacity * lineSize, "识别行缓冲区");
      buffers.text = allocate(maxTextCapacity, "文本缓冲区");
      buffers.result = allocate(resultSize, "结果缓冲区");
    }

    function runtimeSnapshot() {
      return {
        ready: Boolean(moduleInstance && buffers.lines && buffers.text && buffers.result),
        runCount,
        heapBytes: moduleInstance ? moduleInstance.HEAPU8.buffer.byteLength : 0,
        sourceCapacity,
        maxLineCapacity,
        maxTextCapacity,
        lineSize,
        resultSize,
        hasResults: Boolean(lastResults),
        exportEnabled: exportButtons.every(button => !button.disabled)
      };
    }
    window.__lwOcrTest = {snapshot: runtimeSnapshot, plainTextResult, structuredResult: () => lastResults};

    async function boot() {
      const started = performance.now();
      try {
        runButton.disabled = true;
        clsInput.disabled = true;
        if (!moduleInstance) {
          moduleInstance = await makeFactory()({});
          moduleInstance.FS.mkdir("/models");
          for (const [name, key] of [["det.lwm", "det"], ["cls.lwm", "cls"], ["rec.lwm", "rec"], ["ppocr_keys.txt", "dict"]]) moduleInstance.FS.writeFile("/models/" + name, decodeBase64(MODEL_B64[key]));
        }
        const status = moduleInstance._lw_web_init(clsInput.checked ? 1 : 0);
        if (status !== 0) throw new Error("初始化失败：" + status);
        allocateOutputBuffers();
        loadMilliseconds = performance.now() - started;
        runButton.disabled = !selectedFile;
        clsInput.disabled = false;
        statsNode.textContent = `引擎已就绪 · 加载 ${(loadMilliseconds / 1000).toFixed(2)} s · 输出 ${maxLineCapacity} 行/${maxTextCapacity} 字节 · CLS ${clsInput.checked ? "开启" : "关闭"}`;
        statusNode.textContent = selectedFile ? "图片已准备好，点击“开始识别”。" : "就绪，请选择图片。";
      } catch (error) {
        shutdownEngine();
        clsInput.disabled = false;
        statusNode.textContent = "WASM 初始化失败：" + error;
        console.error(error);
      }
    }

    function drawPreview(image, width, height) {
      canvas.width = width; canvas.height = height;
      const context = canvas.getContext("2d"); context.drawImage(image, 0, 0, width, height);
    }

    function drawResults(image, lines, width, height) {
      drawPreview(image, width, height);
      const context = canvas.getContext("2d");
      context.lineWidth = Math.max(2, canvas.width / 500); context.font = "16px sans-serif"; context.strokeStyle = "#e53935"; context.fillStyle = "#e53935";
      for (const line of lines) { const b = line.box; context.beginPath(); context.moveTo(b[0], b[1]); context.lineTo(b[2], b[3]); context.lineTo(b[4], b[5]); context.lineTo(b[6], b[7]); context.closePath(); context.stroke(); context.fillText(line.text, b[0], Math.max(16, b[1] - 3)); }
    }

    async function previewSelectedFile() {
      const file = fileInput.files[0];
      const sequence = ++previewSequence;
      selectedFile = file || null;
      runButton.disabled = true;
      clearLastResults();
      if (!file) {
        statusNode.textContent = "就绪，请选择图片。";
        resultsNode.innerHTML = '<div class="empty">选择图片后，点击“开始识别”显示结果。</div>';
        return;
      }
      try {
        statusNode.textContent = "正在更新图片预览…";
        const image = await createImageBitmap(file);
        try {
          if (sequence !== previewSequence) return;
          const scale = Math.min(1, 1600 / Math.max(image.width, image.height));
          const width = Math.max(1, Math.round(image.width * scale));
          const height = Math.max(1, Math.round(image.height * scale));
          drawPreview(image, width, height);
          resultsNode.innerHTML = '<div class="empty">图片已准备好，点击“开始识别”执行 OCR。</div>';
          statusNode.textContent = `已选择：${file.name}，点击“开始识别”。`;
        } finally {
          if (image.close) image.close();
        }
      } catch (error) {
        if (sequence === previewSequence) {
          selectedFile = null;
          statusNode.textContent = "图片预览失败：" + error;
        }
      } finally {
        if (sequence === previewSequence) runButton.disabled = !selectedFile || !moduleInstance;
      }
    }

    async function runOcr() {
      const file = selectedFile; if (!file || !moduleInstance || running) return;
      const totalStarted = performance.now();
      let image;
      running = true; runButton.disabled = true; clsInput.disabled = true; clearLastResults(); statusNode.textContent = "识别中…";
      try {
        const decodeStarted = performance.now();
        image = await createImageBitmap(file); const originalWidth = image.width, originalHeight = image.height; const scale = Math.min(1, 1600 / Math.max(originalWidth, originalHeight));
        const width = Math.max(1, Math.round(image.width * scale)); const height = Math.max(1, Math.round(image.height * scale));
        drawPreview(image, width, height); const context = canvas.getContext("2d");
        const rgba = context.getImageData(0, 0, width, height).data; const bgr = new Uint8Array(width * height * 3);
        for (let i = 0, j = 0; i < rgba.length; i += 4) { bgr[j++] = rgba[i + 2]; bgr[j++] = rgba[i + 1]; bgr[j++] = rgba[i]; }
        const sourcePointer = ensureSourceCapacity(bgr.length);
        moduleInstance.HEAPU8.set(bgr, sourcePointer);
        const decodeMilliseconds = performance.now() - decodeStarted;
        const inferenceStarted = performance.now();
        const status = moduleInstance._lw_web_run(sourcePointer, bgr.length, width, height, width * 3, buffers.lines, maxLineCapacity, buffers.text, maxTextCapacity, buffers.result);
        if (status !== 0) throw new Error("推理失败：" + status);
        const lineCount = readU32(buffers.result), lines = [];
        if (lineCount > maxLineCapacity) throw new Error("引擎返回的文字行数量超出容量");
        for (let i = 0; i < lineCount; ++i) {
          const p = buffers.lines + i * lineSize, box = [];
          for (let k = 0; k < 8; ++k) box.push(readF32(p + k * 4));
          const offset = readU32(p + 52), length = readU32(p + 56);
          if (offset > maxTextCapacity || length > maxTextCapacity - offset) throw new Error("引擎返回的文本范围无效");
          lines.push({box, text: readUtf8(buffers.text + offset, length), detection: readF32(p + 32), recognition: readF32(p + 36), classification: readF32(p + 40), classificationLabel: readU32(p + 44), rotationDegrees: readU32(p + 48)});
        }
        drawResults(image, lines, width, height);
        resultsNode.innerHTML = lines.length ? lines.map((line, index) => `<div class="line"><div class="index">${String(index + 1).padStart(2, "0")}</div><div class="text"><b>${escapeHtml(line.text)}</b><div class="score">检测 ${(line.detection * 100).toFixed(1)}% · 识别 ${(line.recognition * 100).toFixed(1)}%</div></div></div>`).join("") : '<div class="empty">未检测到文本。</div>';
        const inferenceMilliseconds = performance.now() - inferenceStarted;
        const totalMilliseconds = performance.now() - totalStarted;
        const xScale = originalWidth / width, yScale = originalHeight / height;
        const useCls = clsInput.checked;
        lastResults = {
          schema_version: 1,
          source: file.name,
          image: {width: originalWidth, height: originalHeight},
          options: {use_cls: useCls},
          elapsed_ms: Number(totalMilliseconds.toFixed(3)),
          lines: lines.map((line, index) => {
            const exported = {
              index,
              text: line.text,
              box: line.box.map((coordinate, coordinateIndex) => coordinate * (coordinateIndex % 2 ? yScale : xScale)),
              det_score: line.detection,
              rec_score: line.recognition
            };
            if (useCls) {
              exported.cls_score = line.classification;
              exported.cls_label = line.classificationLabel;
              exported.rotation_degrees = line.rotationDegrees;
            }
            return exported;
          })
        };
        setExportEnabled(true);
        runCount += 1;
        statsNode.textContent = `第 ${runCount} 次 · 引擎加载 ${(loadMilliseconds / 1000).toFixed(2)} s · 图像处理 ${decodeMilliseconds.toFixed(0)} ms · 推理 ${inferenceMilliseconds.toFixed(0)} ms · 总计 ${totalMilliseconds.toFixed(0)} ms · CLS ${clsInput.checked ? "开启" : "关闭"}`;
        statusNode.textContent = `完成：${lineCount} 行`;
      } catch (error) { statusNode.textContent = "识别失败：" + error; console.error(error); } finally { if (image && image.close) image.close(); running = false; runButton.disabled = !selectedFile || !moduleInstance; clsInput.disabled = false; }
    }
    fileInput.addEventListener("change", previewSelectedFile);
    clsInput.addEventListener("change", async () => { if (!moduleInstance || running) return; shutdownEngine(); runButton.disabled = true; statusNode.textContent = "正在切换 CLS 并重新加载引擎…"; await boot(); });
    ["dragenter", "dragover"].forEach(event => dropzone.addEventListener(event, e => { e.preventDefault(); dropzone.classList.add("drag"); }));
    ["dragleave", "drop"].forEach(event => dropzone.addEventListener(event, e => { e.preventDefault(); dropzone.classList.remove("drag"); }));
    dropzone.addEventListener("drop", event => { if (event.dataTransfer.files.length) { fileInput.files = event.dataTransfer.files; fileInput.dispatchEvent(new Event("change")); } });
    runButton.addEventListener("click", runOcr);
    copyTextButton.addEventListener("click", () => copyPlainText().catch(error => { statusNode.textContent = "复制失败：" + error; console.error(error); }));
    exportTxtButton.addEventListener("click", exportTxt);
    exportJsonButton.addEventListener("click", exportJson);
    window.addEventListener("beforeunload", shutdownEngine);
    boot();
  </script>
</body>
</html>
