name: runtime-sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  asan-ubsan:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt
      - name: Install converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Configure ASan/UBSan build
        run: >-
          cmake -S . -B build-sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized runtime
        run: cmake --build build-sanitizers --config RelWithDebInfo
      - name: Compile fallback line workers without persistent pool
        run: >-
          cmake -S . -B build-no-pool -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLW_BUILD_HTTP_DEMO=OFF
          -DLW_EXPERIMENTAL_PERSISTENT_LINE_POOL=OFF
          -DBUILD_TESTING=OFF
      - name: Build fallback line-worker runtime
        run: cmake --build build-no-pool --parallel 2 --target lw_ppocr_c
      - name: Run sanitized correctness gates
        run: >-
          ctest --test-dir build-sanitizers
          -C RelWithDebInfo
          -R "^(lwm_loader|lwm_corruption|abi_layout_contract|native_onnx_import|full_ocr_pipeline_reference|full_ocr_golden_corpus)$"
          --output-on-failure
