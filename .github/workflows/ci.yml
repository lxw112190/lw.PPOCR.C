name: model-analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt
      - name: Install converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build runtime and convert REC model
        run: cmake --build build --config Release
      - name: Regenerate analysis
        run: cmake --build build --target analyze_models --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package development archive
        run: cpack --config build/CPackConfig.cmake -C Release
      - name: Verify generated reports are current
        shell: bash
        run: git diff --exit-code -- docs/SUPPORTED_OPS_V0.md docs/ppocrv6-tiny-analysis.json
      - name: Upload development archive
        uses: actions/upload-artifact@v4
        with:
          name: lw.PPOCR.C-${{ runner.os }}-${{ runner.arch }}
          path: build/packages/*
          if-no-files-found: error
