name: model-analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        # Pin the Windows image because windows-latest can move to a newer
        # Visual Studio generation while this job intentionally targets VS 2022.
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt
      - name: Set up compiler cache
        if: runner.os == 'Linux'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Install converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Configure Windows MSVC
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build runtime and convert models
        run: cmake --build build --config Release
      - name: Regenerate analysis
        run: cmake --build build --target analyze_models --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package development archive
        run: cpack --config build/CPackConfig.cmake -C Release
      - name: Verify generated reports are current
        shell: bash
        run: git diff --exit-code -- docs/SUPPORTED_OPS_V0.md docs/ppocrv6-tiny-analysis.json
      - name: Upload development archive
        uses: actions/upload-artifact@v7
        with:
          name: lw.PPOCR.C-${{ runner.os }}-${{ runner.arch }}
          path: build/packages/*
          if-no-files-found: error
