name: browser-wasm-sdk-and-html

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_web_profile:
        description: "Release profile: compiled Tiny/Small Web, canonical Medium/Node"
        required: false
        default: false
        type: boolean
      build_web_variants:
        description: "Build PP-OCRv6 Small and Medium standalone Web artifacts"
        required: false
        default: false
        type: boolean
      compiled_rec:
        description: "Test the experimental compiled REC backend in WASM"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_web_profile:
        required: false
        default: false
        type: boolean
      build_web_variants:
        required: false
        default: false
        type: boolean
      compiled_rec:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build browser OCR SDK and standalone HTML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-converter.txt
            requirements-wasm-test.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r requirements-converter.txt
          -r requirements-wasm-test.txt

      - name: Check WASM benchmark report contract
        run: |
          python -m unittest discover -s tests -p test_compare_wasm_rec_benchmark.py
          python -m unittest discover -s tests -p test_summarize_wasm_rec_memory.py
          python -m unittest discover -s tests -p test_summarize_wasm_pointwise_epilogue.py
          python -m unittest discover -s tests -p test_web_compiled_diagnostics.py
          python -m unittest discover -s tests -p test_web_release_profile.py

      - name: Cache Playwright Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Configure WASM build
        run: >-
          emcmake cmake -S . -B build-wasm -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLW_BUILD_HTTP_DEMO=OFF
          -DLW_BUILD_CSHARP_DEMOS=OFF
          -DBUILD_TESTING=OFF
          -DLW_WASM_COMPILED_REC=${{ inputs.compiled_rec || false }}
          -DLW_WASM_REC_LAZY_FALLBACK=${{ inputs.compiled_rec || false }}
          -DLW_WASM_POINTWISE_ROWS=2
          -DLW_BUILD_WEB_MODEL_VARIANTS=${{ inputs.build_web_variants || false }}

      - name: Build browser and Node WASM distributions
        run: >-
          cmake --build build-wasm
          --target lw-ocr-js lw-ocr-html lw-node-wasm-package det_demo_fixture
          --parallel

      - name: Verify SIMD128 Erf and GELU bitwise contract
        run: |
          cmake --build build-wasm --target wasm-erf-contract --parallel
          node build-wasm/wasm-erf-contract.js

      - name: Build optional PP-OCRv6 Small and Medium Web variants
        if: inputs.build_web_variants == true
        run: >-
          cmake --build build-wasm
          --target lw-ocr-html-all
          --parallel

      - name: Verify browser and Node artifacts
        shell: bash
        run: |
          test -s build-wasm/lw-ppocr.js
          test -s build-wasm/ocr-demo.html
          test -s build-wasm/node-wasm/runtime.cjs
          node_archive="$(find build-wasm -maxdepth 1 -type f -name 'lw.PPOCR.C-*-node-wasm.zip' -print -quit)"
          test -n "${node_archive}" && test -s "${node_archive}"
          test -s "${node_archive}.sha256"
          ! grep -a -q '__LW_' build-wasm/lw-ppocr.js
          ! grep -a -q '__LW_' build-wasm/ocr-demo.html
          ! grep -a -q 'LwPdf' build-wasm/lw-ppocr.js
          grep -a -q '6.3.289' build-wasm/ocr-demo.html
          grep -a -q 'embedded-pdfjs-wasm/' build-wasm/ocr-demo.html
          grep -a -q 'openjpeg.wasm' build-wasm/ocr-demo.html
          grep -a -q 'BinaryDataFactory' build-wasm/ocr-demo.html
          echo 'f401927e692efc7735e0cd528c490d0dd31b7f0972c122b7040df805be45cce4  web/vendor/pdfjs/pdf.min.mjs' | sha256sum -c -
          echo 'a33cfe728c584fdba4fcc1fd54bcdc2f9f2f13889ddbb5b2bd1d0f8cbe49b84e  web/vendor/pdfjs/pdf.worker.min.mjs' | sha256sum -c -
          echo 'e6bee67724a7b5436fe8162638e3708cfc8d52b6342db69a49715e30ff27cfdc  web/vendor/pdfjs/jbig2.wasm' | sha256sum -c -
          echo '004a0e62db930ba9ff2a22212f4554d0bb57a0635a8287caf70f98117cee14ba  web/vendor/pdfjs/openjpeg.wasm' | sha256sum -c -
          echo '663d86126d5f5fcb1c61490f94353e2a8375660b8c5498ab3ebab5a34b08800e  web/vendor/pdfjs/qcms_bg.wasm' | sha256sum -c -
          # The checksum file stores only the archive basename. Verify from
          # the archive directory so sha256sum resolves that name correctly.
          (
            cd "$(dirname "${node_archive}")"
            sha256sum -c "$(basename "${node_archive}").sha256"
          )

      - name: Verify optional PP-OCRv6 Web variants
        if: inputs.build_web_variants == true
        shell: bash
        run: |
          set -euo pipefail
          for variant in small medium; do
            test -s "build-wasm/lw-ppocr-v6-${variant}.js"
            test -s "build-wasm/ocr-demo-${variant}.html"
            grep -a -q 'variant: "'${variant}'"' build-wasm/lw-ppocr-v6-${variant}.js
            ! grep -a -q '__LW_' "build-wasm/lw-ppocr-v6-${variant}.js"
            ! grep -a -q '__LW_' "build-wasm/ocr-demo-${variant}.html"
          done

      - name: Run browser SDK contract and memory test
        run: >-
          python web/test_ocr_sdk.py
          --sdk build-wasm/lw-ppocr.js
          --sample models/ppocrv6-tiny/sample.jpg
          --golden ci/web-ppocrv6-tiny.json

      - name: Run standalone HTML UI test
        run: >-
          python web/test_ocr_html.py
          --html build-wasm/ocr-demo.html
          --sample models/ppocrv6-tiny/sample.jpg
          --golden ci/web-ppocrv6-tiny.json

      - name: Compare canonical and compiled WASM full OCR
        if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.compiled_rec == true || inputs.release_web_profile == true
        shell: bash
        run: |
          set -euo pipefail
          print_benchmark_logs_on_failure() {
            local status=$?
            if [[ "${status}" -ne 0 ]]; then
              for log in build-wasm/rec-benchmark-compiled.log \
                         build-wasm/rec-benchmark-compiled-scalar.log \
                         build-wasm/rec-profile-compiled.log; do
                if [[ -s "${log}" ]]; then
                  echo "::group::${log}"
                  cat "${log}"
                  echo '::endgroup::'
                fi
              done
            fi
          }
          trap print_benchmark_logs_on_failure EXIT
          diagnose_compiled_det() {
            local label="$1"
            local package="$2"
            echo "::group::compiled DET diagnostic: ${label}"
            LW_WASM_DET_DEBUG=1 node tests/node/benchmark.cjs \
              --package "${package}" \
              --sample build-wasm/models/sample.ppm \
              --iterations 1 \
              > "build-wasm/rec-det-debug-${label}.json" \
              2> "build-wasm/rec-det-debug-${label}.log" || true
            cat "build-wasm/rec-det-debug-${label}.log"
            echo '::endgroup::'
          }
          if [[ "${{ inputs.compiled_rec || false }}" == "true" ]]; then
            canonical_package=build-wasm-canonical/node-wasm
            compiled_package=build-wasm/node-wasm
            extra_build=build-wasm-canonical
            extra_compiled=OFF
          else
            canonical_package=build-wasm/node-wasm
            compiled_package=build-wasm-compiled/node-wasm
            extra_build=build-wasm-compiled
            extra_compiled=ON
          fi
          emcmake cmake -S . -B "${extra_build}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLW_BUILD_HTTP_DEMO=OFF \
            -DLW_BUILD_CSHARP_DEMOS=OFF \
            -DBUILD_TESTING=OFF \
            -DLW_WEB_PDF=OFF \
            -DLW_WASM_COMPILED_REC="${extra_compiled}" \
            -DLW_WASM_REC_LAZY_FALLBACK="${extra_compiled}" \
            -DLW_WASM_POINTWISE_ROWS=2
          cmake --build "${extra_build}" --target lw-node-wasm-package --parallel
          emcmake cmake -S . -B build-wasm-compiled-scalar -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLW_BUILD_HTTP_DEMO=OFF \
            -DLW_BUILD_CSHARP_DEMOS=OFF \
            -DBUILD_TESTING=OFF \
            -DLW_WEB_PDF=OFF \
            -DLW_WASM_COMPILED_REC=ON \
            -DLW_WASM_REC_LAZY_FALLBACK=ON \
            -DLW_WASM_REC_SIMD_KERNELS=OFF
          cmake --build build-wasm-compiled-scalar --target lw-node-wasm-package --parallel
          compiled_build="${compiled_package%/node-wasm}"
          cmake --build "${compiled_build}" --target wasm-rec-lazy-contract --parallel
          if ! node "${compiled_build}/wasm-rec-lazy-contract.js" \
              > build-wasm/rec-lazy-contract.log 2>&1; then
            cat build-wasm/rec-lazy-contract.log
            exit 1
          fi
          cat build-wasm/rec-lazy-contract.log
          python web/compiled_diagnostics.py --expected-widths 5 \
            build-wasm/rec-lazy-contract.log
          expected_text_sha256="$(node -p "require('./ci/web-ppocrv6-tiny.json').expected_text_sha256")"
          expected_line_count="$(node -p "require('./ci/web-ppocrv6-tiny.json').expected_line_count")"
          node tests/node/benchmark.cjs \
            --package "${canonical_package}" \
            --sample build-wasm/models/sample.ppm \
            --warmup 2 --iterations 7 | tee build-wasm/rec-benchmark-canonical.json
          if ! node tests/node/benchmark.cjs \
            --package build-wasm-compiled-scalar/node-wasm \
            --sample build-wasm/models/sample.ppm \
            --warmup 2 --iterations 7 2> build-wasm/rec-benchmark-compiled-scalar.log \
            | tee build-wasm/rec-benchmark-compiled-scalar.json; then
            diagnose_compiled_det scalar build-wasm-compiled-scalar/node-wasm
            diagnose_compiled_det simd128 "${compiled_package}"
            exit 1
          fi
          if ! node tests/node/benchmark.cjs \
            --package "${compiled_package}" \
            --sample build-wasm/models/sample.ppm \
            --warmup 2 --iterations 7 2> build-wasm/rec-benchmark-compiled.log \
            | tee build-wasm/rec-benchmark-compiled.json; then
            diagnose_compiled_det simd128 "${compiled_package}"
            exit 1
          fi
          LW_X64_REC_PROFILE=1 LW_WASM_OCR_PROFILE=1 LW_REC_MEMORY_PROFILE=1 node tests/node/benchmark.cjs \
            --package "${compiled_package}" \
            --sample build-wasm/models/sample.ppm \
            --expected-text-sha256 "${expected_text_sha256}" \
            --iterations 1 \
            > build-wasm/rec-profile-compiled.json \
            2> build-wasm/rec-profile-compiled.log
          cat build-wasm/rec-benchmark-compiled.log
          cat build-wasm/rec-benchmark-compiled-scalar.log
          grep -q 'LW_WASM_OCR_PROFILE total=' build-wasm/rec-profile-compiled.log
          grep -q 'LW_WASM_DET_PROFILE total=' build-wasm/rec-profile-compiled.log
          grep -Eq 'REC_MEMORY canonical_workspace=[0-9]+ canonical_input=[0-9]+ canonical_output=[0-9]+' \
            build-wasm/rec-profile-compiled.log
          grep -Eq 'LW_WASM_OCR_PROFILE .*det_compiled=1 det_fallback=0 cls_compiled=[1-9][0-9]* cls_fallback=0 rec_compiled=[1-9][0-9]* rec_fallback=0' \
            build-wasm/rec-profile-compiled.log
          set +e
          python tools/compare_wasm_rec_benchmark.py \
            --canonical build-wasm/rec-benchmark-canonical.json \
            --scalar build-wasm/rec-benchmark-compiled-scalar.json \
            --compiled build-wasm/rec-benchmark-compiled.json \
            --profile-log build-wasm/rec-profile-compiled.log \
            --profile-json build-wasm/rec-profile-summary.json \
            --expected-text-sha256 "${expected_text_sha256}" \
            --expected-line-count "${expected_line_count}" \
            | tee build-wasm/rec-benchmark-summary.md
          report_status=${PIPESTATUS[0]}
          set -e
          cat build-wasm/rec-benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"
          python tools/summarize_wasm_rec_memory.py \
            --variant tiny \
            --canonical build-wasm/rec-benchmark-canonical.json \
            --compiled build-wasm/rec-benchmark-compiled.json \
            --profile-json build-wasm/rec-profile-summary.json \
            --profile-log build-wasm/rec-profile-compiled.log \
            | tee build-wasm/rec-memory-summary.md
          cat build-wasm/rec-memory-summary.md >> "$GITHUB_STEP_SUMMARY"
          python tools/summarize_wasm_pointwise_epilogue.py \
            --variant tiny --log build-wasm/rec-profile-compiled.log \
            | tee build-wasm/rec-pointwise-epilogue.md
          cat build-wasm/rec-pointwise-epilogue.md >> "$GITHUB_STEP_SUMMARY"
          python web/compiled_diagnostics.py --expected-widths 5 \
            build-wasm/rec-benchmark-compiled.log
          grep -q 'LW_WASM_REC_LAZY_FALLBACK full_coverage=1 canonical_retained=0' \
            build-wasm/rec-benchmark-compiled.log
          grep -q 'LW_WASM_COMPILED_REC ctc=simd128' \
            build-wasm/rec-benchmark-compiled.log
          grep -Eq 'LW_WASM_COMPILED_CLS layout=nhwc ops=[1-9][0-9]* unsupported=0' \
            build-wasm/rec-benchmark-compiled.log
          grep -Eq 'LW_WASM_COMPILED_DET input=512x512 layout=nhwc ops=[1-9][0-9]* unsupported=0 conversions=[0-9]+ direct_input=1' \
            build-wasm/rec-benchmark-compiled.log
          python web/compiled_diagnostics.py --expected-widths 5 \
            build-wasm/rec-benchmark-compiled-scalar.log
          grep -q 'LW_WASM_REC_LAZY_FALLBACK full_coverage=1 canonical_retained=0' \
            build-wasm/rec-benchmark-compiled-scalar.log
          grep -q 'LW_WASM_COMPILED_REC ctc=simd128' \
            build-wasm/rec-benchmark-compiled-scalar.log
          grep -Eq 'LW_WASM_COMPILED_CLS layout=nhwc ops=[1-9][0-9]* unsupported=0' \
            build-wasm/rec-benchmark-compiled-scalar.log
          grep -Eq 'LW_WASM_COMPILED_DET input=512x512 layout=nhwc ops=[1-9][0-9]* unsupported=0 conversions=[0-9]+ direct_input=1' \
            build-wasm/rec-benchmark-compiled-scalar.log
          exit "$report_status"

      - name: Compare Small canonical and compiled WASM full OCR
        if: github.event_name == 'push' || github.event_name == 'pull_request' || inputs.compiled_rec == true || inputs.release_web_profile == true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.compiled_rec || false }}" == "true" ]]; then
            canonical_package=build-wasm-canonical/node-wasm
            compiled_package=build-wasm/node-wasm
          else
            canonical_package=build-wasm/node-wasm
            compiled_package=build-wasm-compiled/node-wasm
          fi
          overall_status=0
          for variant in small; do
            model_dir="build-wasm/runtime-models/ppocrv6-${variant}"
            if [[ ! -s "${model_dir}/runtime-assets.json" ]]; then
              python tools/prepare_ppocrv6_runtime_variant.py \
                --variant "${variant}" --build-dir build-wasm \
                --model-format onnx \
                --output-dir "${model_dir}"
            fi
            iterations=5
            expected_text_sha256="$(node -p "require('./ci/web-ppocrv6-${variant}.json').expected_text_sha256")"
            expected_line_count="$(node -p "require('./ci/web-ppocrv6-${variant}.json').expected_line_count")"
            node tests/node/benchmark.cjs \
              --package "${canonical_package}" --models "${model_dir}" \
              --sample build-wasm/models/sample.ppm --warmup 1 --iterations "${iterations}" \
              > "build-wasm/wasm-${variant}-canonical.json"
            node tests/node/benchmark.cjs \
              --package build-wasm-compiled-scalar/node-wasm --models "${model_dir}" \
              --sample build-wasm/models/sample.ppm --warmup 1 --iterations "${iterations}" \
              > "build-wasm/wasm-${variant}-scalar.json" \
              2> "build-wasm/wasm-${variant}-scalar.log"
            node tests/node/benchmark.cjs \
              --package "${compiled_package}" --models "${model_dir}" \
              --sample build-wasm/models/sample.ppm --warmup 1 --iterations "${iterations}" \
              > "build-wasm/wasm-${variant}-simd128.json" \
              2> "build-wasm/wasm-${variant}-simd128.log"
            LW_X64_REC_PROFILE=1 LW_WASM_OCR_PROFILE=1 LW_REC_MEMORY_PROFILE=1 node tests/node/benchmark.cjs \
              --package "${compiled_package}" --models "${model_dir}" \
              --sample build-wasm/models/sample.ppm --iterations 1 \
              > "build-wasm/wasm-${variant}-profile.json" \
              2> "build-wasm/wasm-${variant}-profile.log"
            set +e
            python tools/compare_wasm_rec_benchmark.py \
              --canonical "build-wasm/wasm-${variant}-canonical.json" \
              --scalar "build-wasm/wasm-${variant}-scalar.json" \
              --compiled "build-wasm/wasm-${variant}-simd128.json" \
              --profile-log "build-wasm/wasm-${variant}-profile.log" \
              --profile-json "build-wasm/wasm-${variant}-profile-summary.json" \
              --model-variant "${variant}" \
              --expected-text-sha256 "${expected_text_sha256}" \
              --expected-line-count "${expected_line_count}" \
              | tee "build-wasm/wasm-${variant}-summary.md"
            report_status=${PIPESTATUS[0]}
            set -e
            cat "build-wasm/wasm-${variant}-summary.md" >> "$GITHUB_STEP_SUMMARY"
            python tools/summarize_wasm_rec_memory.py \
              --variant "${variant}" \
              --canonical "build-wasm/wasm-${variant}-canonical.json" \
              --compiled "build-wasm/wasm-${variant}-simd128.json" \
              --profile-json "build-wasm/wasm-${variant}-profile-summary.json" \
              --profile-log "build-wasm/wasm-${variant}-profile.log" \
              | tee "build-wasm/wasm-${variant}-memory.md"
            cat "build-wasm/wasm-${variant}-memory.md" >> "$GITHUB_STEP_SUMMARY"
            python tools/summarize_wasm_pointwise_epilogue.py \
              --variant "${variant}" --log "build-wasm/wasm-${variant}-profile.log" \
              | tee "build-wasm/wasm-${variant}-pointwise-epilogue.md"
            cat "build-wasm/wasm-${variant}-pointwise-epilogue.md" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$report_status" -ne 0 ]]; then overall_status=1; fi
            python web/compiled_diagnostics.py --expected-widths 5 "build-wasm/wasm-${variant}-simd128.log"
            grep -q 'LW_WASM_REC_LAZY_FALLBACK full_coverage=1 canonical_retained=0' \
              "build-wasm/wasm-${variant}-simd128.log"
            grep -Eq 'LW_WASM_COMPILED_CLS layout=nhwc ops=[1-9][0-9]* unsupported=0' \
              "build-wasm/wasm-${variant}-simd128.log"
            grep -Eq 'LW_WASM_COMPILED_DET input=512x512 layout=nhwc ops=[1-9][0-9]* unsupported=0 conversions=[0-9]+ direct_input=1' \
              "build-wasm/wasm-${variant}-simd128.log"
            grep -Eq 'LW_WASM_OCR_PROFILE .*det_compiled=1 det_fallback=0 cls_compiled=[1-9][0-9]* cls_fallback=0 rec_compiled=[1-9][0-9]* rec_fallback=0' \
              "build-wasm/wasm-${variant}-profile.log"
            grep -q 'LW_WASM_DET_PROFILE total=' "build-wasm/wasm-${variant}-profile.log"
            grep -Eq 'REC_MEMORY canonical_workspace=[0-9]+ canonical_input=[0-9]+ canonical_output=[0-9]+' \
              "build-wasm/wasm-${variant}-profile.log"
            grep -q 'REC_MEMORY canonical_workspace=0 canonical_input=0 canonical_output=0' \
              "build-wasm/wasm-${variant}-profile.log"
          done
          exit "$overall_status"

      - name: Run browser fallback simulation test
        run: >-
          python web/test_web_browser_fallbacks.py
          --html build-wasm/ocr-demo.html
          --sample models/ppocrv6-tiny/sample.jpg

      - name: Run Small browser SDK OCR and lifecycle contract
        if: inputs.build_web_variants == true
        run: >-
          python web/test_ocr_sdk.py
          --sdk build-wasm/lw-ppocr-v6-small.js
          --sample models/ppocrv6-tiny/sample.jpg
          --golden ci/web-ppocrv6-small.json
          --variant-contract-only

      - name: Run Small standalone HTML OCR contract
        if: inputs.build_web_variants == true
        run: >-
          python web/test_ocr_html.py
          --html build-wasm/ocr-demo-small.html
          --sample models/ppocrv6-tiny/sample.jpg
          --golden ci/web-ppocrv6-small.json
          --variant-contract-only

      - name: Run Medium browser SDK OCR and lifecycle contract
        if: inputs.build_web_variants == true
        run: >-
          python web/test_ocr_sdk.py
          --sdk build-wasm/lw-ppocr-v6-medium.js
          --sample models/ppocrv6-tiny/sample.jpg
          --golden ci/web-ppocrv6-medium.json
          --variant-contract-only
          --html-size-source build-wasm/ocr-demo-medium.html
          --report build-wasm/web-medium-report.json

      - name: Run Medium standalone HTML OCR contract
        if: inputs.build_web_variants == true
        run: >-
          python web/test_ocr_html.py
          --html build-wasm/ocr-demo-medium.html
          --sample models/ppocrv6-tiny/sample.jpg
          --golden ci/web-ppocrv6-medium.json
          --variant-contract-only

      - name: Summarize Medium browser measurements
        if: inputs.build_web_variants == true
        shell: bash
        run: |
          echo "## PP-OCRv6 Medium browser measurements" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build-wasm/web-medium-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run standalone PDF OCR test
        run: >-
          python web/test_pdf_html.py
          --html build-wasm/ocr-demo.html
          --sample models/ppocrv6-tiny/sample.jpg

      # Test the exact release profile on normal main/PR CI as well as tag builds.
      # Reuse the compiled runtime from A/B; never overwrite canonical Medium/Node.
      - name: Build and test release Tiny and Small browser profile
        if: inputs.release_web_profile == true || github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.compiled_rec || false }}" == "true" ]]; then
            echo "release_web_profile requires a canonical primary build" >&2
            exit 1
          fi
          emcmake cmake -S . -B build-wasm-compiled -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLW_BUILD_HTTP_DEMO=OFF \
            -DLW_BUILD_CSHARP_DEMOS=OFF -DBUILD_TESTING=OFF \
            -DLW_DEPLOY_ONNX_MODELS=ON -DLW_WEB_PDF=ON \
            -DLW_BUILD_WEB_MODEL_VARIANTS=ON -DLW_WASM_SIMD128=ON \
            -DLW_WASM_COMPILED_REC=ON -DLW_WASM_COMPILED_DET=ON \
            -DLW_WASM_REC_SIMD_KERNELS=ON -DLW_WASM_REC_LAZY_FALLBACK=ON \
            -DLW_WASM_POINTWISE_ROWS=2 -DLW_WASM_FINE_REC_WIDTHS=OFF \
            -DLW_EXPERIMENTAL_REC_FFN_TILING=OFF -DLW_EXPERIMENTAL_CTC_TILED=OFF
          cmake --build build-wasm-compiled \
            --target lw-ocr-html lw-ocr-html-small wasm-pointwise-contract wasm-erf-contract --parallel
          node build-wasm-compiled/wasm-pointwise-contract.js
          node build-wasm-compiled/wasm-erf-contract.js
          python web/test_ocr_sdk.py --sdk build-wasm-compiled/lw-ppocr.js \
            --sample models/ppocrv6-tiny/sample.jpg --golden ci/web-ppocrv6-tiny.json
          python web/test_ocr_html.py --html build-wasm-compiled/ocr-demo.html \
            --sample models/ppocrv6-tiny/sample.jpg --golden ci/web-ppocrv6-tiny.json
          python web/test_web_browser_fallbacks.py --html build-wasm-compiled/ocr-demo.html \
            --sample models/ppocrv6-tiny/sample.jpg
          python web/test_pdf_html.py --html build-wasm-compiled/ocr-demo.html \
            --sample models/ppocrv6-tiny/sample.jpg
          python web/test_ocr_sdk.py --sdk build-wasm-compiled/lw-ppocr-v6-small.js \
            --sample models/ppocrv6-tiny/sample.jpg --golden ci/web-ppocrv6-small.json --variant-contract-only
          python web/test_ocr_html.py --html build-wasm-compiled/ocr-demo-small.html \
            --sample models/ppocrv6-tiny/sample.jpg --golden ci/web-ppocrv6-small.json --variant-contract-only

      - name: Stage exact tested browser distribution
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "${{ inputs.release_web_profile || false }}" == "true" || \
                "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "pull_request" ]]; then
            options+=(--fast-dir build-wasm-compiled)
          fi
          if [[ "${{ inputs.build_web_variants || false }}" == "true" ]]; then
            options+=(--include-variants)
          fi
          version="$(python -c 'from tools.check_release_readiness import project_version; print(project_version([]))')"
          python tools/stage_web_release_artifacts.py --primary-dir build-wasm \
            --output-dir build/web-distribution --version "$version" \
            --report build/web-release-profile.json "${options[@]}"

      - name: Upload browser artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lw.PPOCR.C-browser-${{ github.sha }}
          path: |
            build/web-distribution/lw-ppocr.js
            build/web-distribution/ocr-demo.html
            build/web-distribution/lw-ppocr-v6-small.js
            build/web-distribution/lw-ppocr-v6-medium.js
            build/web-distribution/ocr-demo-small.html
            build/web-distribution/ocr-demo-medium.html
            build/web-distribution/lw.PPOCR.C-*-node-wasm.zip
            build/web-distribution/lw.PPOCR.C-*-node-wasm.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser distribution audit
        uses: actions/upload-artifact@v7
        with:
          name: web-release-profile-${{ github.sha }}
          path: build/web-release-profile.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Medium browser measurement report
        if: inputs.build_web_variants == true
        uses: actions/upload-artifact@v7
        with:
          name: web-medium-report-${{ github.sha }}
          path: build-wasm/web-medium-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled REC comparison
        if: always() && (github.event_name == 'push' || github.event_name == 'pull_request' || inputs.compiled_rec == true || inputs.release_web_profile == true)
        uses: actions/upload-artifact@v7
        with:
          name: wasm-compiled-rec-comparison-${{ github.sha }}
          path: |
            build-wasm/rec-benchmark-canonical.json
            build-wasm/rec-benchmark-compiled.json
            build-wasm/rec-benchmark-compiled.log
            build-wasm/rec-benchmark-compiled-scalar.json
            build-wasm/rec-benchmark-compiled-scalar.log
            build-wasm/rec-profile-compiled.json
            build-wasm/rec-profile-compiled.log
            build-wasm/rec-profile-summary.json
            build-wasm/rec-benchmark-summary.md
            build-wasm/rec-memory-summary.md
            build-wasm/rec-pointwise-epilogue.md
            build-wasm/rec-lazy-contract.log
            build-wasm/rec-det-debug-*.json
            build-wasm/rec-det-debug-*.log
            build-wasm/wasm-small-*.json
            build-wasm/wasm-small-*.log
            build-wasm/wasm-small-summary.md
            build-wasm/wasm-small-memory.md
            build-wasm/wasm-small-pointwise-epilogue.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Node regression fixture
        uses: actions/upload-artifact@v7
        with:
          name: node-regression-fixture-${{ github.sha }}
          path: build-wasm/models/sample.ppm
          if-no-files-found: error
          retention-days: 14

  legacy:
    name: Build Tiny legacy scalar HTML
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Legacy JavaScript build tools
        working-directory: web
        run: npm ci

      - name: Download modern browser reference
        uses: actions/download-artifact@v8
        with:
          name: lw.PPOCR.C-browser-${{ github.sha }}
          path: modern-web

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-converter.txt
            requirements-wasm-test.txt

      - name: Install Python dependencies
        run: >-
          python -m pip install
          -r requirements-converter.txt
          -r requirements-wasm-test.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Configure Tiny Legacy Web build
        run: >-
          emcmake cmake -S . -B build-wasm-legacy -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLW_BUILD_HTTP_DEMO=OFF
          -DLW_BUILD_CSHARP_DEMOS=OFF
          -DBUILD_TESTING=OFF
          -DLW_WEB_LEGACY=ON
          -DLW_WASM_SIMD128=OFF
          -DLW_WEB_PDF=OFF
          -DLW_BUILD_WEB_MODEL_VARIANTS=OFF

      - name: Build Tiny Legacy Web artifacts
        run: >-
          cmake --build build-wasm-legacy
          --target lw-ocr-js lw-ocr-html
          --parallel

      - name: Verify Tiny Legacy Web artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s build-wasm-legacy/lw_ppocr_web.legacy.js
          test -s build-wasm-legacy/legacy-runtime-report.json
          test -s build-wasm-legacy/lw-ppocr-legacy.js
          test -s build-wasm-legacy/ocr-demo-legacy.html
          ! test -e build-wasm-legacy/runtime.cjs
          ! grep -a -q '__LW_' build-wasm-legacy/lw-ppocr-legacy.js
          ! grep -a -q '__LW_' build-wasm-legacy/ocr-demo-legacy.html
          grep -a -q 'flavor: "legacy"' build-wasm-legacy/lw-ppocr-legacy.js
          grep -a -q 'wasmSimd128: false' build-wasm-legacy/lw-ppocr-legacy.js
          grep -a -q 'minChromeVersion: 70' build-wasm-legacy/lw-ppocr-legacy.js
          grep -a -q 'jsTarget: "chrome70"' build-wasm-legacy/lw-ppocr-legacy.js
          ! grep -a -q '6.3.289' build-wasm-legacy/ocr-demo-legacy.html
          ! grep -a -q 'openjpeg.wasm' build-wasm-legacy/ocr-demo-legacy.html

      - name: Run Legacy whole-artifact Chrome 70 syntax gate
        run: >-
          node web/check_legacy_js_syntax.mjs
          --sdk build-wasm-legacy/lw-ppocr-legacy.js
          --html build-wasm-legacy/ocr-demo-legacy.html
          --ecma-version 2018

      - name: Run Legacy packaging contract gate
        run: >-
          python web/test_legacy_web_syntax.py
          --sdk build-wasm-legacy/lw-ppocr-legacy.js
          --html build-wasm-legacy/ocr-demo-legacy.html

      - name: Run Tiny Legacy OCR contract
        run: >-
          python web/test_legacy_ocr_html.py
          --html build-wasm-legacy/ocr-demo-legacy.html
          --reference-html modern-web/ocr-demo.html
          --sample models/ppocrv6-tiny/sample.jpg
          --golden ci/web-ppocrv6-tiny.json
          --report build-wasm-legacy/legacy-web-report.json

      - name: Upload Legacy runtime debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lw.PPOCR.C-browser-legacy-debug-${{ github.sha }}
          path: |
            build-wasm-legacy/lw_ppocr_web.js
            build-wasm-legacy/lw_ppocr_web.legacy.js
            build-wasm-legacy/legacy-runtime-report.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload Tiny Legacy Web artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lw.PPOCR.C-browser-legacy-${{ github.sha }}
          path: |
            build-wasm-legacy/lw-ppocr-legacy.js
            build-wasm-legacy/ocr-demo-legacy.html
            build-wasm-legacy/legacy-web-report.json
          if-no-files-found: error
          retention-days: 14

  node-smoke:
    name: Node.js ${{ matrix.node-version }} WASM smoke and OCR regression
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download packaged Node/WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: lw.PPOCR.C-browser-${{ github.sha }}
          path: node-artifacts

      - name: Download Node regression fixture
        uses: actions/download-artifact@v8
        with:
          name: node-regression-fixture-${{ github.sha }}
          path: node-artifacts

      - name: Run Node smoke and OCR regression
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find node-artifacts -maxdepth 1 -type f -name '*-node-wasm.zip' -print -quit)"
          test -n "${archive}"
          unzip -q "${archive}" -d node-package
          package_dir="$(find node-package -mindepth 1 -maxdepth 1 -type d -name '*-node-wasm' -print -quit)"
          test -n "${package_dir}"
          expected_text_sha256="$(node -p "require('./ci/web-ppocrv6-tiny.json').expected_text_sha256")"
          node tests/node/smoke.cjs \
            --package "${package_dir}" \
            --sample node-artifacts/sample.ppm \
            --expected-backend wasm128 \
            --expected-text-sha256 "${expected_text_sha256}"
