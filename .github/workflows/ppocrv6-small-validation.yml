name: ppocrv6-small-validation

on:
  workflow_call:
    inputs:
      expected_full_text_sha256_override:
        required: false
        type: string
        default: ""
      runtime_version:
        required: false
        type: string
        default: "0.2.0-preview.1"
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"
      - "include/**"
      - "converter/**"
      - "tools/**"
      - "tests/**"
      - "models/**"
      - "requirements-converter.txt"
      - "ci/ppocrv6-small-validation.json"
      - ".github/workflows/ppocrv6-small-validation.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      expected_full_text_sha256_override:
        description: "Optional full OCR text SHA-256 override"
        required: false
        default: ""
        type: string
      runtime_version:
        description: "Model-pack revision recorded in manifest"
        required: false
        default: "0.2.0-preview.1"
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Small validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt
      - name: Install converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Resolve runtime model revision
        id: runtime
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          runtime_version="${REQUESTED_VERSION}"
          if [[ -z "${runtime_version}" ]]; then runtime_version="0.2.0-preview.1"; fi
          echo "version=${runtime_version}" >> "${GITHUB_OUTPUT}"
      - name: Resolve Small validation contract
        id: contract
        shell: bash
        env:
          EXPECTED_TEXT_SHA256_OVERRIDE: ${{ inputs.expected_full_text_sha256_override }}
        run: >-
          python tools/resolve_small_validation_contract.py
          --contract ci/ppocrv6-small-validation.json
          --expected-full-text-sha256-override "$EXPECTED_TEXT_SHA256_OVERRIDE"
          --github-output "$GITHUB_OUTPUT"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
      - name: Build runtime and validation targets
        run: >-
          cmake --build build --config Release --parallel 2 --target
          det-graph-driver rec-graph-driver lw-ocr-ppm test-dynamic-reshape
          conv-reference-driver packed-conv1x1-benchmark-driver
          conv3x3-stride2-benchmark-driver simd-backend-driver
      - name: Run standard contract tests
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          -R "model_analysis|dynamic_reshape_contract|conv_kernel_reference|packed_conv1x1_benchmark_smoke|conv3x3_stride2_benchmark_smoke|simd_backend_detection"
      - name: Run Small validation pipeline
        run: >-
          python tools/run_small_validation.py
          --detector "${{ steps.contract.outputs.detector_path }}"
          --classifier "${{ steps.contract.outputs.classifier_path }}"
          --recognizer "${{ steps.contract.outputs.recognizer_path }}"
          --dictionary "${{ steps.contract.outputs.dictionary_path }}"
          --build-dir build
          --output-dir build/small-validation-run
          --runtime-version "${{ steps.runtime.outputs.version }}"
          --rec-max-width "${{ steps.contract.outputs.rec_max_width }}"
          --expected-lines "${{ steps.contract.outputs.expected_lines }}"
          --expected-full-text-sha256 "${{ steps.contract.outputs.expected_full_text_sha256 }}"
      - name: Upload Small validation report
        uses: actions/upload-artifact@v7
        with:
          name: ppocrv6-small-validation-${{ matrix.os }}
          path: build/small-validation-run
          if-no-files-found: error
          retention-days: 14
