name: Windows WinForms portable Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install image-contract test dependency
        run: python -m pip install Pillow==10.4.0
      - name: Verify WinForms release version contract
        run: python -m unittest tests.test_winforms_release -v
      - name: Configure x64 static-CRT runtime
        run: >-
          cmake -S . -B build-winforms -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=OFF -DLW_BUILD_HTTP_DEMO=OFF -DLW_BUILD_CSHARP_DEMOS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build native DLL
        run: cmake --build build-winforms --config Release --target lw_ppocr_c_shared --parallel
      - name: Check C# large-image policy and native integration
        run: python tests/test_csharp_image_limits.py --native build-winforms/Release/lw_ppocr_c.dll
      - name: Build and verify exact portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $compiler = @(& $vswhere -latest -products '*' -find 'MSBuild/Current/Bin/Roslyn/csc.exe') | Select-Object -First 1
          if (-not $compiler -or -not (Test-Path -LiteralPath $compiler)) { throw 'Roslyn C# compiler not found' }
          $framework = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies/Microsoft/Framework/.NETFramework/v4.8'
          $options = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $options += @('--release-version', $env:GITHUB_REF_NAME) }
          python tools/package_winforms_demo.py --build-dir build-winforms --csc $compiler --framework-dir $framework --output-dir build/winforms-distribution @options
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archives = @(Get-ChildItem -LiteralPath build/winforms-distribution -Filter '*.zip' -File)
          if ($archives.Count -ne 1) { throw 'expected exactly one WinForms ZIP' }
          python tests/test_winforms_package.py --archive $archives[0].FullName --csc $compiler --framework-dir $framework
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload tested WinForms ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: lw-ppocr-winforms-windows-x64-${{ github.sha }}
          path: |
            build/winforms-distribution/*.zip
            build/winforms-distribution/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
