name: ARM64 OCR Performance

on:
  workflow_dispatch:
    inputs:
      warmup:
        description: Benchmark warm-up calls per case
        required: false
        default: "3"
      iterations:
        description: Benchmark measured calls per case
        required: false
        default: "10"
      profile_iterations:
        description: Instrumented profile iterations per case
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  prepare-assets:
    name: Prepare architecture-independent OCR assets
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt
      - name: Install converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Convert models and fixtures once
        run: |
          set -euo pipefail
          cmake -S . -B build-assets -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLW_BUILD_HTTP_DEMO=OFF
          cmake --build build-assets --parallel 2 --target \
            convert_rec_model convert_cls_model convert_det_model \
            rec_demo_fixture det_demo_fixture
          mkdir -p prepared-assets
          cp build-assets/models/rec.lwm prepared-assets/
          cp build-assets/models/rec-lwm.json prepared-assets/
          cp build-assets/models/cls.lwm prepared-assets/
          cp build-assets/models/cls-lwm.json prepared-assets/
          cp build-assets/models/det.lwm prepared-assets/
          cp build-assets/models/det-lwm.json prepared-assets/
          cp build-assets/models/sample-crop.ppm prepared-assets/
          cp build-assets/models/sample.ppm prepared-assets/
          cp models/ppocrv6-tiny/ppocr_keys.txt prepared-assets/
          (cd prepared-assets && sha256sum \
            rec.lwm rec-lwm.json cls.lwm cls-lwm.json \
            det.lwm det-lwm.json sample-crop.ppm sample.ppm \
            ppocr_keys.txt > SHA256SUMS)
      - name: Upload prepared OCR assets
        uses: actions/upload-artifact@v7
        with:
          name: prepared-arm64-ocr-assets
          path: prepared-assets/
          if-no-files-found: error
          retention-days: 7

  native-arm64:
    name: Native ARM64 profile and profile kit
    needs: prepare-assets
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-converter.txt
      - name: Install Python test and converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Download prepared OCR assets
        uses: actions/download-artifact@v8
        with:
          name: prepared-arm64-ocr-assets
          path: .ci/preconverted
      - name: Verify prepared OCR assets
        run: (cd .ci/preconverted && sha256sum --check SHA256SUMS)
      - name: Record native build environment
        run: |
          set -euo pipefail
          mkdir -p .ci
          {
            echo "project=lw.PPOCR.C"
            echo "commit=${GITHUB_SHA}"
            echo "verification=native-github-hosted-arm64-runner"
            echo "requested_architecture=arm64"
            echo "uname=$(uname -a)"
            echo "machine=$(uname -m)"
            echo "glibc=$(ldd --version 2>&1 | sed -n '1p')"
            echo "c_compiler=$(cc --version | sed -n '1p')"
            echo "cmake=$(cmake --version | sed -n '1p')"
            echo "lscpu=$(lscpu | tr '\n' ';')"
          } > .ci/BUILD-ENVIRONMENT-arm64.txt
          cat .ci/BUILD-ENVIRONMENT-arm64.txt
      - name: Configure and build profile drivers
        run: |
          set -euo pipefail
          cmake -S . -B build-arm64 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLW_PRECONVERTED_ASSETS_DIR="$GITHUB_WORKSPACE/.ci/preconverted" \
            -DLW_BUILD_ENVIRONMENT_FILE="$GITHUB_WORKSPACE/.ci/BUILD-ENVIRONMENT-arm64.txt" \
            -DLW_PACKAGE_PLATFORM_OVERRIDE=linux-arm64-ubuntu22.04
          cmake --build build-arm64 --parallel 2 --target \
            full-ocr-profile-driver full-ocr-intra-benchmark \
            simd-backend-driver conv-reference-driver kernel-reference-driver
      - name: Run ARM64 correctness gates
        run: |
          set -euo pipefail
          ctest --test-dir build-arm64 --output-on-failure \
            -R '^(simd_backend_detection|scalar_kernel_reference|conv_kernel_reference|full_ocr_pipeline_reference|full_ocr_golden_corpus)$'
      - name: Collect native OCR profile
        env:
          PROFILE_WARMUP: ${{ inputs.warmup }}
          PROFILE_ITERATIONS: ${{ inputs.iterations }}
          PROFILE_ITERATIONS_INSTRUMENTED: ${{ inputs.profile_iterations }}
        run: |
          set -euo pipefail
          python tools/collect_native_ocr_profile.py \
            --profile-driver build-arm64/full-ocr-profile-driver \
            --benchmark-driver build-arm64/full-ocr-intra-benchmark \
            --det .ci/preconverted/det.lwm \
            --cls .ci/preconverted/cls.lwm \
            --rec .ci/preconverted/rec.lwm \
            --dictionary .ci/preconverted/ppocr_keys.txt \
            --image .ci/preconverted/sample.ppm \
            --variant tiny \
            --target-width 960 \
            --warmup "$PROFILE_WARMUP" \
            --iterations "$PROFILE_ITERATIONS" \
            --profile-iterations "$PROFILE_ITERATIONS_INSTRUMENTED" \
            --expected-backend neon \
            --require-rss \
            --commit "$GITHUB_SHA" \
            --output arm64-profile-results
          cat arm64-profile-results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build downloadable ARM64 profile kit
        run: |
          set -euo pipefail
          rm -rf profile-kit
          mkdir -p profile-kit/bin profile-kit/models profile-kit/tools
          cp build-arm64/full-ocr-profile-driver profile-kit/bin/
          cp build-arm64/full-ocr-intra-benchmark profile-kit/bin/
          cp .ci/preconverted/det.lwm profile-kit/models/
          cp .ci/preconverted/cls.lwm profile-kit/models/
          cp .ci/preconverted/rec.lwm profile-kit/models/
          cp .ci/preconverted/ppocr_keys.txt profile-kit/models/
          cp .ci/preconverted/sample.ppm profile-kit/models/
          cp tools/collect_native_ocr_profile.py profile-kit/tools/
          cp tools/run_arm64_profile.sh profile-kit/
          cp .ci/BUILD-ENVIRONMENT-arm64.txt profile-kit/BUILD-ENVIRONMENT.txt
          chmod +x profile-kit/run_arm64_profile.sh
          ldd profile-kit/bin/full-ocr-profile-driver | tee .ci/profile-driver-ldd.txt
          if grep -Fq 'not found' .ci/profile-driver-ldd.txt; then
            exit 1
          fi
          (cd profile-kit && sha256sum \
            bin/full-ocr-profile-driver bin/full-ocr-intra-benchmark \
            models/det.lwm models/cls.lwm models/rec.lwm \
            models/ppocr_keys.txt models/sample.ppm \
            tools/collect_native_ocr_profile.py run_arm64_profile.sh \
            BUILD-ENVIRONMENT.txt > SHA256SUMS)
      - name: Upload ARM64 profile results
        uses: actions/upload-artifact@v7
        with:
          name: lw-ppocr-arm64-profile-results-${{ github.sha }}
          path: arm64-profile-results/
          if-no-files-found: error
          retention-days: 30
      - name: Upload ARM64 profile kit
        uses: actions/upload-artifact@v7
        with:
          name: lw-ppocr-arm64-profile-kit-${{ github.sha }}
          path: profile-kit/
          if-no-files-found: error
          retention-days: 30
