name: Native REC DW-PW fusion experiment

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rec-dw-pw-fusion.yml'
      - 'tests/rec_dw_pw_contract_driver.c'
  pull_request:
    paths:
      - '.github/workflows/rec-dw-pw-fusion.yml'
      - 'CMakeLists.txt'
      - 'tests/rec_dw_pw_contract_driver.c'
      - 'src/runtime/x64_rec_backend_compile.c'
      - 'src/runtime/x64_rec_backend_execute.c'
      - 'src/runtime/x64_rec_backend_internal.h'
      - 'src/simd/avx2_nhwc_depthwise.c'
      - 'src/simd/avx2_nhwc_pointwise.c'
      - 'src/kernels/nhwc_internal.h'

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install converter dependencies
        run: python -m pip install -r requirements-converter.txt
      - name: Build matched control and DW-PW configurations
        run: |
          $ErrorActionPreference = 'Stop'
          $generator = @('-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release')
          if ($IsWindows) { $generator = @('-G', 'Visual Studio 17 2022', '-A', 'x64') }
          foreach ($flavor in @('control', 'fusion')) {
            $enabled = if ($flavor -eq 'fusion') { 'ON' } else { 'OFF' }
            cmake -S . -B "build/dw-pw-$flavor" @generator -DBUILD_TESTING=ON -DLW_BUILD_HTTP_DEMO=OFF -DLW_NATIVE_FINE_REC_WIDTHS=OFF -DLW_EXPERIMENTAL_REC_FFN_TILING=OFF -DLW_EXPERIMENTAL_REC_FFN_FUSION=OFF "-DLW_EXPERIMENTAL_REC_DW_PW_FUSION=$enabled" -DLW_REC_DW_PW_TILE_PIXELS=48
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $targets = @('lw-ocr-benchmark', 'lw-ocr-ppm')
            if ($flavor -eq 'fusion') { $targets += @('rec-dw-pw-contract-driver', 'ocr-pipeline-driver', 'rec-pipeline-driver', 'nhwc-depthwise-portable-driver') }
            cmake --build "build/dw-pw-$flavor" --config Release --parallel 2 --target @targets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Gate bitwise contracts and public OCR golden corpus
        run: ctest --test-dir build/dw-pw-fusion -C Release -R '^(rec_dw_pw_contract_.*|nhwc_depthwise_portable|full_ocr_golden_corpus|rec_golden_corpus|onnx_e2e_comparison_contract|source_final_newline_contract)$' --output-on-failure
      - name: Compare full OCR and memory
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = if ($IsWindows) { 'Release/' } else { '' }
          $ext = if ($IsWindows) { '.exe' } else { '' }
          python tools/compare_onnx_e2e.py --baseline "build/dw-pw-control/${bin}lw-ocr-benchmark$ext" --candidate "build/dw-pw-fusion/${bin}lw-ocr-benchmark$ext" --sample build/dw-pw-fusion/models/sample.ppm --rounds 3 --iterations 5 --collect-text --output build/dw-pw-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content build/dw-pw-results/report.md | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rec-dw-pw-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/dw-pw-results/
            build/dw-pw-fusion/Testing/Temporary/LastTest.log
          if-no-files-found: warn
